# Two-cell OCUDU gNB:
#
# Cell 1:
#   PCI: 1
#   PLMN: 001/01
#   TAC: 7
#
# Cell 2:
#   PCI: 2
#   PLMN: 999/99
#   TAC: 8
#
# Both cells:
#   Band n78
#   20 MHz
#   30 kHz SCS
#   Same DL ARFCN 640334
#   One X410, using two independent RF channels

gnb_id: 411
gnb_id_bit_length: 32

cu_cp:
  amf:
    addrs: 127.0.0.5
    port: 38412
    bind_addrs: 127.0.0.1

    # Both PLMN/TAC combinations must also exist in
    # Open5GS amf.yaml.
    supported_tracking_areas:
      # Tracking area for Cell 1
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

      # Tracking area for Cell 2
      - tac: 7
        plmn_list:
          - plmn: "99999"
            tai_slice_support_list:
              - sst: 1

  # Do not move a connected UE between the two cells
  # based on measurement reports.
  mobility:
    trigger_handover_from_measurements: false

ru_sdr:
  device_driver: uhd
  device_args: type=x4xx,mgmt_addr=192.168.123.2,master_clock_rate=245.76e6
  clock: internal
  sync: internal
  srate: 30.72

  # Initial common gain values.
  # They can be changed independently per RF channel
  # using the remote-control interface.
  tx_gain: 50
  rx_gain: 30

# Common/default configuration inherited by both cells.
cell_cfg:
  dl_arfcn: 640334
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30

  nof_antennas_dl: 1
  nof_antennas_ul: 1

  # Default values inherited unless overridden under cells.
  plmn: "00101"
  tac: 7

  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12

  prach:
    prach_config_index: 1

  pdsch:
    mcs_table: qam64

  pusch:
    mcs_table: qam64

# Per-cell configuration.
# Each entry inherits cell_cfg and overrides the listed fields.
cells:
  # -----------------------------------------------------------
  # Cell 1: intended for Android UE 1
  # -----------------------------------------------------------
  - pci: 1
    sector_id: 0
    plmn: "00101"
    dl_arfcn: 640334
    tac: 7

    prach:
      prach_config_index: 1
      prach_root_sequence_index: 0

  # -----------------------------------------------------------
  # Cell 2: intended for Android UE 2
  # -----------------------------------------------------------
  - pci: 2
    sector_id: 1
    plmn: "99999"
    dl_arfcn: 640334
    tac: 7

    prach:
      prach_config_index: 1
      prach_root_sequence_index: 64

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: enable
  mac_filename: /tmp/gnb_mac.pcap

  ngap_enable: enable
  ngap_filename: /tmp/gnb_ngap.pcap

metrics:
  autostart_stdout_metrics: false
  enable_json: true
  enable_log: false
  enable_verbose: true

  layers:
    enable_sched: true
    enable_mac: true

  periodicity:
    du_report_period: 100

remote_control:
  enabled: true
  bind_addr: 127.0.0.1
  port: 8001
