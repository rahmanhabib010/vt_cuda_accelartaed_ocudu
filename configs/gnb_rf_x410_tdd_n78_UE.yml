# This example configuration outlines how to configure the OCUDU gNB to create a single FDD cell
# transmitting in band 3, with 20 MHz bandwidth and 15 kHz sub-carrier-spacing. A USRP B200 is configured
# as the RF frontend using split 8, with a Leo Bodnar GPSDO as an external reference clock.

# This particular configuration is intended to be used with srsUE. Note the `pdcch` parameters set in the
# `cell_cfg` section. These are set to match the capabilities of srsUE.

cu_cp:
  amf:
    addrs: 127.0.0.5
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

#cu_up:
#  ngu:
#    socket:
#      - bind_addr: 127.0.0.1

ru_sdr:
  device_driver: uhd
  device_args: type=x4xx,mgmt_addr=192.168.123.2,master_clock_rate=245.76e6
  clock: internal
  sync: internal
  srate: 30.72
  tx_gain: 50
  rx_gain: 30

cell_cfg:
#  dl_arfcn: 368500
#  band: 3
  dl_arfcn: 640334                  # ARFCN of the downlink carrier (center frequency).
  band: 78                           # The NR band.
  channel_bandwidth_MHz: 20
#  common_scs: 15
  common_scs: 30
  plmn: "00101"
  tac: 7
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: enable
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /tmp/gnb_ngap.pcap

metrics:
  autostart_stdout_metrics: false
  enable_json: true
  enable_log: false
  enable_verbose: true

  layers:
    enable_sched: true
    enable_mac: true

  periodicity:
    du_report_period: 100

remote_control:
  enabled: true
  bind_addr: 127.0.0.1
  port: 8001
